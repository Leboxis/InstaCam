name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      SCHEME: InstaCam
      PROJECT: InstaCam.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Ensure iOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS "; then
            echo "No iOS runtime, downloading..."
            xcodebuild -downloadPlatform iOS -quiet
          fi
          xcrun simctl list runtimes

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          DESTINATION=$(xcrun simctl list devices available \
            | grep -m1 -E "iPhone" \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DESTINATION" ]; then
            echo "No iPhone simulator available, skipping tests."
            exit 0
          fi
          echo "Using simulator: $DESTINATION"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            test
